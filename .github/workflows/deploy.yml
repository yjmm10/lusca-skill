# GitHub Pages 部署工作流 — lucas-skill 官网
# 纯静态免构建：部署 site/ 目录（index.html 位于 artifact 顶层）。
# 部署前自动重跑 scripts/build-site-data.py，保证站点数据与 skills/ 单一源一致。
# 前置条件：仓库 Settings → Pages → Source 选「GitHub Actions」。

name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 门禁：plugin/skills/ 分发拷贝必须与 skills/ 单一源一致，过期则部署失败（本地跑 build-site-data.py 后提交）
      - name: Check plugin dist freshness
        run: python scripts/build-site-data.py --check

      # 重新生成 site/data/skills.json（扫描 skills/ frontmatter），站点永远与单一源同步
      - name: Generate site data
        run: python scripts/build-site-data.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
