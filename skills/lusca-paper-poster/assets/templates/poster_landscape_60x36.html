<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>{{TITLE}}</title>
<style>
  @page { size: 60in 36in; margin: 0; }
  :root {
    --accent: #1d3a87;
    --accent-soft: #e8edf7;
    --callout: #ae2622;
    --text: #1c1c1c;
    --muted: #555;
    --bg: #fafaf7;
    --card: #ffffff;
    --font-sans: Arial, "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: #ddd;
    color: var(--text);
    font-family: var(--font-sans);
  }
  .poster {
    width: 60in;
    height: 36in;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    padding: 0.45in 0.5in 0.4in;
    gap: 0.28in;
    overflow: hidden;
  }
  .header {
    display: grid;
    grid-template-columns: 1fr;
    gap: 0.12in;
    padding: 0.28in 0.35in;
    background: var(--accent-soft);
    border: 3px solid var(--accent);
    border-radius: 0.12in;
    flex: 0 0 auto;
  }
  .header h1 {
    margin: 0;
    font-size: 42pt;
    line-height: 1.15;
    color: var(--accent);
    font-weight: 700;
  }
  .header .authors {
    margin: 0;
    font-size: 16pt;
    color: var(--muted);
  }
  .header .venue {
    margin: 0;
    font-size: 14pt;
    color: var(--accent);
    font-weight: 600;
  }
  .columns {
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    grid-template-columns: 1fr 1.15fr 1fr;
    gap: 0.28in;
  }
  .col {
    display: flex;
    flex-direction: column;
    gap: 0.22in;
    min-height: 0;
  }
  .section {
    background: var(--card);
    border: 2px solid rgba(29, 58, 135, 0.25);
    border-radius: 0.1in;
    padding: 0.16in 0.2in 0.14in;
    display: flex;
    flex-direction: column;
    gap: 0.08in;
    overflow: hidden;
    flex: 0 0 auto; /* text cards hug content — avoid EMPTY grow voids */
  }
  .section.grow {
    flex: 1 1 auto;
    min-height: 0;
    justify-content: flex-start;
  }
  .section h2 {
    margin: 0;
    font-size: 22pt;
    color: #fff;
    background: var(--accent);
    padding: 0.1in 0.16in;
    border-radius: 0.06in;
    font-weight: 700;
    flex: 0 0 auto;
  }
  .section ul {
    margin: 0;
    padding-left: 0.4in;
    font-size: 18pt;
    line-height: 1.4;
  }
  .section li { margin-bottom: 0.1in; }
  .section p {
    margin: 0;
    font-size: 18pt;
    line-height: 1.4;
  }
  .section.caveat h2 { background: var(--callout); }
  .section.caveat p { color: #5a1a18; }
  figure {
    margin: 0.08in 0 0;
    flex: 0 1 auto;
    width: 100%;
    max-height: 92%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  figure img {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
    display: block;
  }
  .scan {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 0.35in;
    padding: 0.18in 0.28in;
    background: var(--card);
    border: 2px solid rgba(29, 58, 135, 0.25);
    border-radius: 0.1in;
  }
  .scan .scan-label {
    font-size: 14pt;
    color: var(--muted);
    margin-right: auto;
    font-weight: 600;
  }
  .qr-tile {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.06in;
  }
  .qr-tile img {
    width: 1.1in;
    height: 1.1in;
    object-fit: contain;
  }
  .qr-tile span {
    font-size: 11pt;
    color: var(--muted);
  }
  .qr-tile[hidden] { display: none; }
</style>
</head>
<body>
<div class="poster">
  <header class="header">
    <h1>{{TITLE}}</h1>
    <p class="authors">{{AUTHORS}}</p>
    <p class="venue">{{VENUE}}</p>
  </header>

  <div class="columns">
    <div class="col">
      <div class="section" data-section="problem">
        <h2>Problem</h2>
        <ul>{{PROBLEM_LIS}}</ul>
      </div>
      <div class="section" data-section="contribution">
        <h2>Contribution</h2>
        <ul>{{CONTRIBUTION_LIS}}</ul>
      </div>
      <div class="section grow" data-section="left-spacer" data-measure-skip="true" style="border:none;background:transparent;padding:0;"></div>
    </div>

    <div class="col">
      <div class="section" data-section="method">
        <h2>Method</h2>
        <ul>{{METHOD_LIS}}</ul>
      </div>
      <div class="section grow" data-section="method-fig">
        <h2>Architecture</h2>
        <figure>{{METHOD_FIGURE}}</figure>
      </div>
    </div>

    <div class="col">
      <div class="section" data-section="results">
        <h2>Results</h2>
        <ul>{{RESULTS_LIS}}</ul>
      </div>
      <div class="section grow" data-section="result-fig">
        <h2>Key Figure</h2>
        <figure>{{RESULT_FIGURE}}</figure>
      </div>
      <div class="section" data-section="takeaway">
        <h2>Takeaway</h2>
        <p>{{TAKEAWAY}}</p>
      </div>
      <div class="section caveat" data-section="caveat">
        <h2>Caveat</h2>
        <p>{{CAVEAT}}</p>
      </div>
    </div>
  </div>

  <div class="section scan" data-section="scan-to-read">
    <div class="scan-label">Scan to Read</div>
    <div class="qr-tile" id="qr-paper" {{QR_PAPER_HIDDEN}}>
      <img class="qr-img" src="{{QR_PAPER_SRC}}" alt="Paper QR" />
      <span>{{QR_PAPER_LABEL}}</span>
    </div>
    <div class="qr-tile" id="qr-code" {{QR_CODE_HIDDEN}}>
      <img class="qr-img" src="{{QR_CODE_SRC}}" alt="Code QR" />
      <span>{{QR_CODE_LABEL}}</span>
    </div>
  </div>
</div>
</body>
</html>
